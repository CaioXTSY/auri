name: Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  executar-ssh:
    name: Deploy SSH
    runs-on: ubuntu-latest
    steps:
      - name: Extrair configurações
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ fromJSON(secrets.SSH_CONFIG).host }}
          username: ${{ fromJSON(secrets.SSH_CONFIG).username }}
          password: ${{ fromJSON(secrets.SSH_CONFIG).password }}
          port: ${{ fromJSON(secrets.SSH_CONFIG).port || 22 }}
          script: |
            TOKEN_GITHUB="${{ fromJSON(secrets.SSH_CONFIG).tokengithub }}"
            SSH_PATH="${{ fromJSON(secrets.SSH_CONFIG).path }}"
            COMMIT_HASH="${{ github.sha }}"
            REPO_NAME="${{ env.REPO_NAME }}"
            AMBIENTE="prod"
            
            cd ${SSH_PATH}
            bash ./auri_deploy.sh "$COMMIT_HASH" "$REPO_NAME" "main" "$AMBIENTE" "$TOKEN_GITHUB"
        env:
          REPO_NAME: ${{ env.REPO_NAME }}
