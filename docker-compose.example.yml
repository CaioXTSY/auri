services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    command: ["node", "dist/main"]
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    volumes:
      - auri_uploads:/app/uploads
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    command: ["node", "dist-runner/worker/code-runner.worker.js"]
    env_file:
      - ./backend/.env
    environment:
      CODE_RUNNER_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "3010:3010"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  auri_uploads:
